---
name: Homebox
version: dev
slug: homebox
description: Inventory and organization system for the things in your home
url: https://github.com/kashif-khan/app-homebox
ingress: true
ingress_port: 1337
ingress_stream: true
panel_icon: mdi:package-variant-closed
init: false
arch:
  - aarch64
  - amd64
backup: cold
map:
  - type: ssl
    read_only: true
ports:
  7745/tcp: null
ports_description:
  7745/tcp: Web interface & API (not required for Ingress)
options:
  allow_registration: true
  auto_increment_asset_id: true
  max_upload_size: 10
  allow_local_login: true
  oidc_enabled: false
  mcp_enabled: false
  mcp_allow_writes: true
  mcp_allow_delete: false
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  base_url: url?
  allow_registration: bool
  auto_increment_asset_id: bool
  max_upload_size: int(1,)
  smtp_host: str?
  smtp_port: port?
  smtp_from: email?
  smtp_user: str?
  smtp_password: password?
  allow_local_login: bool
  oidc_enabled: bool
  oidc_issuer_url: url?
  oidc_client_id: str?
  oidc_client_secret: password?
  oidc_scope: str?
  oidc_allowed_groups: str?
  oidc_group_claim: str?
  oidc_email_claim: str?
  oidc_name_claim: str?
  oidc_auto_redirect: bool?
  oidc_verify_email: bool?
  backup_google_client_id: str?
  backup_google_client_secret: password?
  backup_microsoft_client_id: str?
  backup_microsoft_client_secret: password?
  backup_microsoft_tenant: str?
  backup_dropbox_client_id: str?
  backup_dropbox_client_secret: password?
  backup_allow_custom_endpoints: bool?
  mcp_enabled: bool
  mcp_allow_writes: bool
  mcp_allow_delete: bool
  ssl: bool
  certfile: str
  keyfile: str
